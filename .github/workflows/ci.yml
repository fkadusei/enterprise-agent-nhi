# CI: the repo's invariants, checked on every push.
#   1. rego policy tests — authorization logic is tested like code
#   2. python syntax check — all three services + shared lib
#   3. go build — the jti CredentialComposer plugin compiles
#   4. gitleaks — proves "nothing secret-shaped committed" continuously
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  opa-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install opa
        run: |
          curl -sSfL -o opa https://openpolicyagent.org/downloads/v0.68.0/opa_linux_amd64_static
          chmod +x opa
      - name: opa test
        run: ./opa test opa/ -v

  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: syntax check
        run: python -m compileall -q src/

  go-plugin-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: build the jti CredentialComposer plugin
        working-directory: spire-plugin
        run: go build ./...

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Guard rail for the .env convention: the committed template is
      # .env.example; the real .env must never be tracked.
      - name: ensure no .env is committed
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env must never be committed — use .env.example instead"
            exit 1
          fi
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::a tracked .env file was found"
            exit 1
          fi
          echo "ok: no .env tracked (.env.example is the committed template)"
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
