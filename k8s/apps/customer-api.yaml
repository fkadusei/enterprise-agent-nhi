# Customer API — the downstream resource that makes token forwarding fail
# (it only accepts aud=customer-api). See src/customer_api/app.py.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-api
  namespace: agent-nhi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-api
  template:
    metadata:
      labels:
        app: customer-api
    spec:
      containers:
        - name: customer-api
          image: agent-nhi/customer-api:demo
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: customer-api
  namespace: agent-nhi
spec:
  selector:
    app: customer-api
  ports:
    - name: http
      port: 9000
      targetPort: 9000
