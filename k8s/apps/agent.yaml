# =============================================================================
# The agent pod. Two things to notice:
#   1. serviceAccountName: agent  -> this SA + this namespace is what SPIRE
#      attests. The pod spec is how identity is DECIDED, not a credential.
#   2. The only volume is the SPIFFE Workload API socket. No secret mounts,
#      no env credentials (the optional OPENAI_API_KEY is the documented
#      "last static credential" exception — see docs/threat-model.md).
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent
  namespace: agent-nhi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: agent-nhi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent
  template:
    metadata:
      labels:
        app: agent
    spec:
      serviceAccountName: agent
      containers:
        - name: agent
          image: agent-nhi/agent:demo      # built + loaded into kind by setup.sh
          imagePullPolicy: IfNotPresent
          env:
            - name: LLM_PROVIDER
              value: ollama              # zero-credential default
            - name: OLLAMA_URL
              value: http://host.docker.internal:11434
            - name: SPIFFE_SOCKET
              value: unix:///run/spire/sockets/agent.sock
            # Optional API-key path (LLM_PROVIDER=openai). Created by
            # setup.sh from your gitignored .env; absent by default.
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-api-key
                  key: OPENAI_API_KEY
                  optional: true
          volumeMounts:
            - name: spiffe-workload-api
              mountPath: /run/spire/sockets
              readOnly: true
      volumes:
        - name: spiffe-workload-api
          hostPath:
            path: /run/spire/sockets
            type: Directory
