# =============================================================================
# The agent pod. Two things to notice:
#   1. serviceAccountName: agent  -> this SA + this namespace is what SPIRE
#      attests. The pod spec is how identity is DECIDED, not a credential.
#   2. The only volume is the SPIFFE Workload API socket. No secret mounts,
#      no env credentials (the optional LLM_API_KEY, for a remote
#      OpenAI-compatible provider, is the documented "last static credential"
#      exception — see docs/threat-model.md).
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent
  namespace: agent-nhi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: agent-nhi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent
  template:
    metadata:
      labels:
        app: agent
    spec:
      serviceAccountName: agent
      containers:
        - name: agent
          image: agent-nhi/agent:demo      # built + loaded into kind by setup.sh
          imagePullPolicy: IfNotPresent
          env:
            # Provider-agnostic LLM. Default is Ollama's native API (no
            # credentials). For any OpenAI-compatible provider, set
            # LLM_PROVIDER=openai-compatible plus LLM_BASE_URL and LLM_MODEL
            # (e.g. https://api.groq.com/openai/v1), and provide LLM_API_KEY
            # via the secret below.
            - name: LLM_PROVIDER
              value: ollama              # or: openai-compatible
            - name: OLLAMA_URL
              value: http://host.docker.internal:11434
            # - name: LLM_BASE_URL
            #   value: https://api.openai.com/v1
            # - name: LLM_MODEL
            #   value: gpt-4o-mini
            - name: SPIFFE_SOCKET
              value: unix:///run/spire/sockets/agent.sock
            # Optional API-key path. Created by setup.sh from your gitignored
            # .env; absent by default.
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-api-key
                  key: LLM_API_KEY
                  optional: true
          volumeMounts:
            - name: spiffe-workload-api
              mountPath: /run/spire/sockets
              readOnly: true
      volumes:
        - name: spiffe-workload-api
          hostPath:
            path: /run/spire/sockets
            type: Directory
